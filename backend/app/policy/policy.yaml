# Purchasing policy. Version-controlled on purpose: every number the agent
# reasons with is auditable and changeable without touching a prompt.
version: "1.3.0"

replenishment:
  # Days between planning cycles. Cover horizon = lead_time + review_period.
  review_period_days: 7
  # When recent actuals disagree with the forecast, plan against the higher of
  # the two. Under-buying a Turbo SKU costs a lost order; over-buying costs cash.
  demand_basis: max_of_forecast_and_recent_7d
  # Treat the forecast as stale if 7d actuals deviate beyond this fraction.
  forecast_drift_threshold: 0.25
  # Perishables are never bought beyond this fraction of their shelf life.
  perishable_cover_fraction: 0.6
  # Do not raise a PO for a gap smaller than this many days of demand.
  min_order_days_of_cover: 2

constraints:
  respect_moq: true
  respect_lot_size: true
  respect_supplier_max_order: true
  respect_budget: true
  respect_storage: true
  # Storage headroom kept free at every node for inbound overflow.
  storage_buffer_fraction: 0.05

autonomy:
  # An action may execute without a human only if ALL of these hold.
  auto_execute:
    max_order_value_usd: 5000
    min_confidence: 0.80
    require_all_rubric_checks_pass: true
    require_no_open_questions: true
  # Anything above this always goes to a human regardless of confidence.
  always_escalate_above_usd: 20000
  # Categories a buyer must always sign off on.
  always_escalate_categories: []

retry:
  max_replan_attempts: 2
  escalate_after_failed_replans: true
